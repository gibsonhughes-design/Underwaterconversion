<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Underwater Soundings · Aureos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#004578; --blue:#0072BC; --cyan:#00A3E2; --teal:#00A99D; --green:#00A658; --lime:#98C63D;
  --spectrum:linear-gradient(90deg,#004578 0%,#0072BC 20%,#00A3E2 38%,#00A99D 56%,#00A658 74%,#98C63D 100%);
  --bg:#FFFFFF; --surface:#FFFFFF; --surface2:#EEF3F7; --ink:#132130; --muted:#5A6B7C; --line:#D3DDE6; color-scheme:light;
  --accent:#004578; --accent-ink:#FFFFFF; --accent-soft:#E3EEF7; --prev:#F5F8FB; --danger:#B42318;
  --head:'Outfit', 'Segoe UI', system-ui, sans-serif; --body:'Barlow', 'Segoe UI', system-ui, sans-serif;
  --navh:64px;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html,body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.45; }
body{ min-height:100vh; }
img,svg{ max-width:100%; }
button,input,select{ font:inherit; color:inherit; }
h1,h2,h3{ font-family:var(--head); font-weight:600; margin:0; letter-spacing:-0.01em; }
h1{ font-size:1.75rem; line-height:1.15; }
h2{ font-size:1.15rem; }
h3{ font-size:1rem; }
p{ margin:0; }
.muted{ color:var(--muted); }
:focus-visible{ outline:2px solid var(--cyan); outline-offset:2px; }

/* top bar */
.top{ position:sticky; top:env(safe-area-inset-top,0px); z-index:30; background:var(--surface); }
.top-in{ display:flex; align-items:center; gap:18px; padding:12px 24px; max-width:1440px; margin:0 auto; }
.brand{ display:flex; align-items:center; gap:14px; min-width:0; flex:1; }
.brand img{ height:24px; width:auto; display:block; }
.brand-text{ border-left:1px solid var(--line); padding-left:14px; min-width:0; }
.brand-text strong{ font-family:var(--head); font-weight:600; font-size:1.05rem; display:block; line-height:1.2; }
.brand-text span{ color:var(--muted); font-size:.88rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block; }
.spectrum{ height:4px; background:var(--spectrum); }
.actions{ display:flex; gap:6px; align-items:center; }
.btn{ display:inline-flex; align-items:center; gap:8px; border:1px solid var(--line); background:var(--surface); padding:8px 14px; border-radius:8px; cursor:pointer; font-weight:500; font-size:.95rem; white-space:nowrap; min-height:40px; }
.btn:hover{ background:var(--surface2); }
.btn svg{ width:18px; height:18px; flex:none; }
.btn.primary{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
.btn.primary:hover{ filter:brightness(1.08); }
.btn.ghost{ border-color:transparent; background:transparent; }
.btn.ghost:hover{ background:var(--surface2); }
.btn.danger{ color:var(--danger); }
.btn.sm{ padding:5px 10px; min-height:32px; font-size:.88rem; }
.sep{ width:1px; height:26px; background:var(--line); margin:0 4px; }
.menu-btn{ display:none; }

/* tabs */
.tabs{ background:var(--surface); border-bottom:1px solid var(--line); }
.tabs-in{ display:flex; gap:4px; max-width:1440px; margin:0 auto; padding:0 16px; overflow-x:auto; }
.tab{ position:relative; border:0; background:none; padding:14px 14px 13px; cursor:pointer; font-family:var(--head); font-weight:500; font-size:.98rem; color:var(--muted); display:flex; align-items:center; gap:8px; white-space:nowrap; }
.tab svg{ width:19px; height:19px; }
.tab:hover{ color:var(--ink); }
.tab[aria-current="page"]{ color:var(--ink); }
.tab[aria-current="page"]::after{ content:""; position:absolute; left:10px; right:10px; bottom:-1px; height:3px; border-radius:3px 3px 0 0; background:var(--spectrum); }

main{ max-width:1440px; margin:0 auto; padding:28px 24px 64px; }
.page-head{ display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-end; gap:16px; margin-bottom:22px; }
.page-head p{ color:var(--muted); max-width:62ch; margin-top:6px; }

.card{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:20px; }
.card > h2{ margin-bottom:14px; }
.card-head{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-bottom:12px; flex-wrap:wrap; }
.grid2{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; }
.span2{ grid-column:1 / -1; }

.fld{ display:flex; flex-direction:column; gap:5px; margin-bottom:14px; }
.fld > span{ font-size:.86rem; color:var(--muted); font-weight:500; }
.fld small{ color:var(--muted); font-size:.82rem; }
.fld input,.fld select, .inp{ border:1px solid var(--line); background:var(--surface); border-radius:7px; padding:9px 11px; min-height:42px; width:100%; }
.fld input:focus,.fld select:focus,.inp:focus{ border-color:var(--cyan); outline:none; box-shadow:0 0 0 3px color-mix(in srgb,var(--cyan) 22%,transparent); }
.row3{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
.row2{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }

.seg{ display:inline-flex; border:1px solid var(--line); border-radius:9px; padding:3px; background:var(--surface2); gap:2px; flex-wrap:wrap; }
.seg button{ border:0; background:none; border-radius:7px; padding:7px 13px; cursor:pointer; font-weight:500; font-size:.92rem; color:var(--muted); }
.seg button[aria-pressed="true"]{ background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(0,30,60,.14); }

.chips{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
.chip{ border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:7px 15px; cursor:pointer; font-weight:500; font-size:.93rem; display:inline-flex; gap:8px; align-items:center; }
.chip[aria-pressed="true"]{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
.chip .cnt{ font-size:.78rem; opacity:.75; }
.chip.add{ border-style:dashed; color:var(--muted); }

/* data tables */
.tbl-wrap{ overflow-x:auto; border:1px solid var(--line); border-radius:9px; }
table.data{ border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums; font-size:.95rem; }
table.data th{ text-align:left; font-weight:600; font-size:.8rem; color:var(--muted); padding:8px 8px 7px; background:var(--surface2); border-bottom:1px solid var(--line); vertical-align:bottom; line-height:1.25; white-space:nowrap; }
table.data th small{ display:block; font-weight:500; color:var(--muted); font-size:.75rem; }
table.data td{ border-bottom:1px solid var(--line); padding:0; height:40px; }
table.data tr:last-child td{ border-bottom:0; }
table.data td input{ width:100%; min-width:58px; border:0; background:transparent; padding:9px 8px; height:40px; text-align:right; }
table.data td input.lab{ text-align:left; font-weight:500; min-width:92px; }
table.data td input:focus{ outline:2px solid var(--cyan); outline-offset:-2px; background:var(--surface); }
table.data td.calc{ text-align:right; padding:0 10px; font-weight:600; color:var(--accent); background:var(--accent-soft); min-width:64px; }
table.data td.pv{ background:var(--prev); }
table.data td.pv input{ color:var(--muted); }
table.data td.x{ width:38px; text-align:center; }
.icon{ border:0; background:none; cursor:pointer; color:var(--muted); width:34px; height:34px; border-radius:7px; display:inline-grid; place-items:center; }
.icon:hover{ background:var(--surface2); color:var(--danger); }
.icon svg{ width:16px; height:16px; }
.tbl-actions{ display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; align-items:center; }
.legend-note{ display:flex; gap:14px; flex-wrap:wrap; font-size:.82rem; color:var(--muted); margin-top:10px; }
.legend-note i{ display:inline-block; width:12px; height:12px; border-radius:3px; vertical-align:-2px; margin-right:5px; }

.paper{ background:#fff; color:#000; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
.paper svg{ display:block; width:100%; height:auto; }
.xs-layout > *, .grid2 > *, .rad-grid > *, .struct-sketch > *{ min-width:0; }
.xs-layout{ display:grid; grid-template-columns:minmax(360px,5fr) 7fr; gap:18px; align-items:start; }
.xs-layout .paper{ position:sticky; top:150px; }

.el-bar{ display:grid; grid-template-columns:2fr 1.2fr 1.2fr auto; gap:12px; align-items:end; }
.el-bar .fld{ margin:0; }
.stepper{ display:flex; align-items:center; gap:4px; border:1px solid var(--line); border-radius:8px; padding:3px; background:var(--surface); min-height:42px; }
.stepper b{ min-width:34px; text-align:center; font-variant-numeric:tabular-nums; }
.stepper button{ width:34px; height:34px; border:0; border-radius:6px; background:var(--surface2); cursor:pointer; font-size:1.1rem; font-weight:600; }
.rad-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:16px; margin-top:18px; }
.radial h3{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.radial .paper{ margin-top:12px; }
.radial table.data td input{ min-width:48px; }

.drop{ border:2px dashed var(--line); border-radius:12px; padding:26px 18px; text-align:center; cursor:pointer; color:var(--muted); transition:border-color .15s, background .15s; }
.drop:hover,.drop.over{ border-color:var(--cyan); background:color-mix(in srgb,var(--cyan) 7%,transparent); color:var(--ink); }
.drop strong{ color:var(--ink); display:block; font-family:var(--head); font-weight:600; margin-bottom:4px; }
.flow-list{ margin:14px 0 0; padding:0; list-style:none; display:grid; gap:8px; font-size:.92rem; }
.flow-list li{ display:grid; grid-template-columns:110px 18px 1fr; gap:8px; align-items:center; }
.flow-list b{ font-weight:600; }
.flow-list .arr{ color:var(--teal); }

.wl{ display:flex; align-items:baseline; gap:10px; padding:14px 16px; border-radius:10px; background:var(--accent-soft); margin-top:4px; }
.wl b{ font-family:var(--head); font-size:1.6rem; font-weight:600; color:var(--accent); font-variant-numeric:tabular-nums; }
table.mini{ border-collapse:collapse; width:100%; }
table.mini th{ text-align:left; font-size:.8rem; color:var(--muted); font-weight:600; padding:0 6px 6px; }
table.mini td{ padding:4px 6px; }
table.mini td:first-child{ font-weight:500; white-space:nowrap; }
table.mini td.wlv{ text-align:right; font-weight:600; font-variant-numeric:tabular-nums; color:var(--accent); }

.lib{ display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:16px; }
.lib-item{ display:flex; flex-direction:column; gap:10px; }
.lib-item .paper{ aspect-ratio:4/3.4; display:grid; place-items:center; padding:8px; }
.lib-item .paper svg{ max-height:100%; width:auto; height:100%; }
.lib-item p{ font-size:.88rem; color:var(--muted); }
.lib-item .lib-foot{ display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:auto; }
.struct-sketch{ display:grid; grid-template-columns:3fr 2fr; gap:20px; align-items:start; }
.struct-sketch .paper{ padding:12px; }
.struct-sketch .paper svg{ max-height:560px; }

.report-pages{ display:grid; gap:22px; justify-items:center; }
.sheet{ background:#fff; box-shadow:0 1px 3px rgba(0,25,50,.18), 0 8px 24px rgba(0,25,50,.08); width:100%; }
.sheet.l{ max-width:1123px; } .sheet.p{ max-width:794px; }
.sheet svg{ display:block; width:100%; height:auto; }
.page-label{ font-size:.82rem; color:var(--muted); justify-self:start; margin-bottom:-14px; }

.note-warn{ border-color:#E8B04A; background:color-mix(in srgb,#E8B04A 12%,var(--surface)); margin-bottom:18px; padding:14px 18px; }
.note-warn[hidden]{ display:none; }
.linkbtn{ border:0; background:none; padding:0; color:var(--accent); text-decoration:underline; cursor:pointer; font-weight:600; }
.headline{ font-size:1.05rem; margin-bottom:16px; max-width:80ch; }
.stats{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; }
.stat{ border:1px solid var(--line); border-radius:10px; padding:14px 16px; display:flex; flex-direction:column; gap:2px; min-width:0; }
.stat span{ font-size:.82rem; color:var(--muted); font-weight:500; }
.stat b{ font-family:var(--head); font-size:1.65rem; font-weight:600; font-variant-numeric:tabular-nums; color:var(--accent); line-height:1.2; }
.stat small{ color:var(--muted); font-size:.85rem; line-height:1.3; }
.stat.flag{ border-color:#E8B04A; background:#FFF8EA; }
.stat.flag b{ color:#9A5B00; }
.check{ border-radius:10px; padding:12px 14px; margin-bottom:10px; border:1px solid; }
.check b{ display:block; font-family:var(--head); font-weight:600; margin-bottom:3px; }
.check p{ font-size:.93rem; }
.check.ok{ background:#ECF8F0; border-color:#9FD6B2; } .check.ok b{ color:#0B6B33; }
.check.warn{ background:#FFF8EA; border-color:#E8B04A; } .check.warn b{ color:#8A5300; }
.check.high{ background:#FDEEEC; border-color:#F0A69C; } .check.high b{ color:#A1261A; }
table.data.list td{ padding:8px 10px; height:auto; }
table.data.list th.n, table.data.list td.n{ text-align:right; font-variant-numeric:tabular-nums; }
table.data.list td.d{ font-weight:600; } td.d.neg{ color:#A1261A; } td.d.pos{ color:#0B6B33; }
table.data.list .linkbtn{ font-weight:500; text-align:left; }
.tag{ display:inline-block; font-size:.75rem; font-weight:600; padding:2px 8px; border-radius:999px; white-space:nowrap; }
.tag.warn{ background:#FFF0CC; color:#8A5300; } .tag.high{ background:#FBD9D4; color:#A1261A; }
textarea.stmt{ resize:vertical; font:inherit; line-height:1.45; min-height:96px; }
.empty{ text-align:center; padding:40px 20px; color:var(--muted); }

/* toast + sheet */
.toast{ position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translate(-50%,20px); opacity:0; pointer-events:none; background:#0D2233; color:#fff; padding:11px 18px; border-radius:10px; font-size:.94rem; z-index:80; transition:opacity .2s, transform .2s; max-width:min(92vw,560px); box-shadow:0 8px 24px rgba(0,0,0,.25); }
.toast.on{ opacity:1; transform:translate(-50%,0); }
.toast.err{ background:#7A1B12; }
.scrim{ position:fixed; inset:0; background:rgba(5,20,32,.45); z-index:60; display:none; }
.scrim.on{ display:block; }
.msheet{ position:fixed; left:0; right:0; bottom:0; z-index:70; background:var(--surface); border-radius:16px 16px 0 0; padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px)); transform:translateY(105%); transition:transform .22s ease, visibility .22s; visibility:hidden; }
.msheet.on{ transform:none; visibility:visible; }
.msheet .grab{ width:40px; height:4px; border-radius:4px; background:var(--line); margin:4px auto 12px; }
.msheet button{ display:flex; width:100%; align-items:center; gap:14px; border:0; background:none; padding:13px 8px; font-size:1rem; font-weight:500; border-radius:10px; cursor:pointer; text-align:left; }
.msheet button:hover{ background:var(--surface2); }
.msheet button svg{ width:22px; height:22px; color:var(--accent); }
.msheet button small{ display:block; color:var(--muted); font-weight:400; font-size:.84rem; }
.confirm{ position:fixed; inset:0; z-index:85; display:none; place-items:center; background:rgba(5,20,32,.45); padding:20px; }
.confirm.on{ display:grid; }
.cf-box{ background:var(--surface); border-radius:14px; padding:22px; max-width:420px; width:100%; box-shadow:0 12px 40px rgba(0,0,0,.25); }
.cf-box p{ color:var(--muted); margin:8px 0 20px; }
.cf-actions{ display:flex; justify-content:flex-end; gap:10px; flex-wrap:wrap; }
.btn.danger-fill{ background:#B42318; border-color:#B42318; color:#fff; }
.busy{ position:fixed; inset:0; z-index:90; display:none; place-items:center; background:rgba(5,20,32,.35); }
.busy.on{ display:grid; }
.busy div{ background:var(--surface); padding:20px 26px; border-radius:12px; display:flex; gap:14px; align-items:center; font-weight:500; }
.spin{ width:22px; height:22px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--cyan); animation:sp 0.8s linear infinite; }
@keyframes sp{ to{ transform:rotate(360deg);} }
@media (prefers-reduced-motion: reduce){ .spin{ animation-duration:2.4s; } .toast,.msheet{ transition:none; } }

@media (max-width:1100px){
  .xs-layout{ grid-template-columns:1fr; }
  .xs-layout .paper{ position:static; }
  .struct-sketch{ grid-template-columns:1fr; }
}
@media (max-width:1000px){ .stats{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
@media (max-width:860px){
  .actions .lbl{ display:none; }
  .el-bar{ grid-template-columns:1fr 1fr; }
}
@media (max-width:760px){
  .top-in{ padding:10px 14px; gap:10px; }
  .actions{ display:none; }
  .menu-btn{ display:inline-flex; }
  .brand img{ height:20px; }
  .brand-text{ padding-left:10px; }
  .brand-text strong{ font-size:.95rem; }
  .tabs{ position:fixed; left:0; right:0; bottom:0; z-index:40; border-top:1px solid var(--line); border-bottom:0; padding-bottom:env(safe-area-inset-bottom,0px); }
  .tabs-in{ padding:0; gap:0; justify-content:space-around; overflow:visible; }
  .tab{ flex-direction:column; gap:3px; font-size:.72rem; padding:9px 4px 8px; flex:1; }
  .tab svg{ width:22px; height:22px; }
  .tab[aria-current="page"]{ color:var(--accent); }
  .tab[aria-current="page"]::after{ top:0; bottom:auto; left:22%; right:22%; border-radius:0 0 3px 3px; }
  main{ padding:20px 14px calc(var(--navh) + 40px + env(safe-area-inset-bottom,0px)); }
  h1{ font-size:1.4rem; }
  .grid2{ grid-template-columns:1fr; }
  .card{ padding:16px; border-radius:10px; }
  .row3{ grid-template-columns:1fr; gap:0; }
  .el-bar{ grid-template-columns:1fr; }
  .rad-grid{ grid-template-columns:1fr; }
  .chips{ flex-wrap:nowrap; overflow-x:auto; margin-left:-14px; margin-right:-14px; padding:0 14px 4px; }
  .chip{ flex:none; }
  .toast{ bottom:calc(var(--navh) + 18px + env(safe-area-inset-bottom,0px)); }
  .flow-list li{ grid-template-columns:96px 16px 1fr; }
  .brand-text strong{ white-space:nowrap; }
  table.data{ font-size:.92rem; }
  table.data th{ padding:7px 5px; font-size:.74rem; white-space:normal; }
  table.data td input{ min-width:44px; padding:9px 5px; }
  table.data td input.lab{ min-width:72px; }
  table.data td.calc{ min-width:48px; padding:0 6px; }
  table.data td.x{ width:30px; }
  .icon{ width:28px; }
  .hide-sm{ display:none; }
  .stats{ grid-template-columns:1fr; }
  .tab{ font-size:.66rem; }
  table.mini.stack thead{ display:none; }
  table.mini.stack tr{ display:grid; grid-template-columns:1fr 1fr; gap:6px 10px; padding:10px 0; border-bottom:1px solid var(--line); }
  table.mini.stack td{ padding:0; }
  table.mini.stack td:first-child{ grid-column:1 / -1; font-family:var(--head); font-weight:600; }
  table.mini.stack td[data-l]::before{ content:attr(data-l); display:block; font-size:.78rem; color:var(--muted); margin-bottom:3px; }
  table.mini.stack td.wlv{ grid-column:1 / -1; text-align:left; }
}
</style>
</head>
<body>
<header class="top">

}

const DATE_RE = /^\d{1,2}\/\d{1,2}\/\d{2,4}$/;

  return `${y}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
}
function tokenizePage(pg) {
  const out = [];
  pg.items.forEach(it => {
    const s = String(it.s || '').trim(); if (!s) return;
    const parts = s.split(/\s+/);
    if (parts.length > 1 && parts.every(p => NUM_RE.test(p) || DATE_RE.test(p) || p === 'N/A')) {

    } else out.push({ s, x: it.x, y: it.y, w: it.w, cx: it.x + it.w / 2 });
  });
  out.sort((a, b) => a.y - b.y || a.x - b.x);
  const lines = []; const tol = 1.5;
  out.forEach(t => { const l = lines[lines.length - 1]; if (l && Math.abs(t.y - l.y) <= tol) l.items.push(t); else lines.push({ y: t.y, items: [t] }); });
  lines.forEach(l => l.items.sort((a, b) => a.x - b.x));

}
function classifyTitle(t) {
  if (/30\s*m\s*U\s*\/?\s*S/i.test(t)) return 'us30';
  if (/30\s*m\s*D\s*\/?\s*S/i.test(t)) return 'ds30';
  if (/U\s*\/?\s*S\s*Face/i.test(t)) return 'usFace';
  if (/Centre\s*line|Center\s*line/i.test(t)) return 'centre';

}

    const lines = tokenizePage(pg);

    if (!res.structure) { const st = all.find(t => /\d+\s*mls\s*\d+\s*yds/i.test(t.s)); if (st) res.structure = st.s.trim(); }
    // date-header triples => tables
    const tables = [];

      const ds = l.items.filter(t => DATE_RE.test(t.s));
      for (let i = 0; i + 2 < ds.length; i++) {

        if (g1 > 0 && g2 > 0 && g2 / g1 > 0.6 && g2 / g1 < 1.6 && g1 < pg.w * 0.12) {
          tables.push({ y: l.y, c: [ds[i].cx, ds[i + 1].cx, ds[i + 2].cx], s: (g1 + g2) / 2, dates: [ds[i].s, ds[i + 1].s, ds[i + 2].s] });
          i += 2;

    const tripleLineYs = new Set(tables.map(t => t.y));
    tables.forEach((tb, ti) => {
      const lo = tb.c[0] - 2.6 * tb.s, hi = tb.c[2] + 0.6 * tb.s, labMax = tb.c[0] - 0.55 * tb.s;
      const inX = t => t.cx >= lo && t.cx <= tb.c[2] + 1.8 * tb.s;
      const title = lines.filter(l => l.y < tb.y - 0.5 && l.y > tb.y - 45).flatMap(l => l.items.filter(inX)).map(t => t.s).join(' ');
      const next = tables.filter((o, j) => j !== ti && o.y > tb.y + 2 && Math.abs(o.c[0] - tb.c[0]) < tb.s * 1.5).map(o => o.y);

        if (labT.length > 1 && NUM_RE.test(labT[0]) && !NUM_RE.test(labT[labT.length - 1])) labT = labT.slice(1);

      const above = lines.filter(l => l.y < tb.y - 0.5 && l.y > tb.y - 45).sort((a, b) => b.y - a.y);
      let name = '', rn = null;
      for (const l of above) {

        if (rn == null) { const r = l.items.find(t => /Radial\s*\d+/i.test(t.s) && t.cx >= lo && t.cx <= tb.c[2] + tb.s); if (r) rn = +r.s.match(/Radial\s*(\d+)/i)[1]; }

    });
    // general data: datum level, position, datum-to-water rows ("1.7 m 19/08/26")
    lines.forEach(l => {
      const it = l.items;
      it.forEach((t, i) => {
        if (/Datum Level/i.test(t.s) && res.datumLevel == null) { const n = it.slice(i + 1).find(u => NUM_RE.test(u.s) && u.x - t.x < pg.w * 0.12); if (n) res.datumLevel = num(n.s); }

        if (!DATE_RE.test(t.s)) return;

          if (NUM_RE.test(it[j].s)) { if (it.slice(j + 1, i).every(u => /^m$/i.test(u.s))) res.d2w.push({ v: num(it[j].s), date: pdfDateISO(t.s) }); break; }

  const s = blankState();

  s.d2w = { current: d2wFor(dts[0], 0), previous: d2wFor(dts[1], 1), penultimate: d2wFor(dts[2], 2) };
  SECTIONS.forEach(sec => { if (res.xs[sec.key]) s.xs[sec.key] = res.xs[sec.key].map(r => ({ label: r.label, reading: null, _level: r.cur, prev: r.prev, pen: r.pen })); else s.xs[sec.key] = []; });

  res.radials.forEach(r => {

function askConfirm(title, body, okLabel) {
  return new Promise(resolve => {
    const d = $('#confirm');
    $('#cfTitle').textContent = title; $('#cfBody').textContent = body || ''; $('#cfOk').textContent = okLabel || 'Confirm';
    const prevFocus = document.activeElement;
    const done = v => { d.classList.remove('on'); document.removeEventListener('keydown', key, true); d.onclick = null; if (prevFocus && prevFocus.focus) prevFocus.focus(); resolve(v); };
    const key = e => { if (e.key === 'Escape') { e.preventDefault(); done(false); } };
    d.onclick = e => { if (e.target === d || e.target.closest('#cfCancel')) done(false); else if (e.target.closest('#cfOk')) done(true); };
    document.addEventListener('keydown', key, true);
    d.classList.add('on'); $('#cfCancel').focus();
  });
}

  const cards = el.radials.map((r, ri) => {

    </div>

function changesBody() {
  const s = state, which = ui.cmp, c = CMP[which], thr = s.checkThreshold > 0 ? s.checkThreshold : 0.75;
  const sm = summarize(comparePoints(s, which), thr), st = changeStatements(s, which, sm, thr);
  const dC = fmtDate(s.dates.current) || 'current', dO = fmtDate(s.dates[c.date]) || c.name;
  if (!sm.n) return `<section class="card empty"><h2 style="margin-bottom:8px">Nothing to compare yet</h2><p>Enter current readings and import or type ${c.name} levels to see changes. Points need a value in both columns to be compared.</p></section>`;
  const loc = it => `<button class="linkbtn" data-act="goto" data-page="${it.go.page}" data-sec="${it.go.sec || ''}" data-el="${it.go.el ?? ''}">${esc(it.loc)}</button>`;
  const tile = (label, val, sub, cls = '') => `<div class="stat ${cls}"><span>${label}</span><b>${val}</b><small>${sub}</small></div>`;
  const m = sm.max;
  const tiles = [
    tile('Maximum difference', `${Math.abs(m.diff).toFixed(2)} m`, m.diff ? `bed ${dirWord(m.diff)} at ${esc(m.loc)}` : 'no change anywhere', Math.abs(m.diff) >= thr ? 'flag' : ''),
    tile('Average change', `${sgn(sm.avg)} m`, `${sm.avg < 0 ? 'bed lower on average' : sm.avg > 0 ? 'bed higher on average' : 'no net change'} · mean size ${sm.avgAbs.toFixed(2)} m`),
    tile('Largest drop', sm.maxDown ? `${sgn(sm.maxDown.diff)} m` : '–', sm.maxDown ? esc(sm.maxDown.loc) : 'no point lower', sm.maxDown && Math.abs(sm.maxDown.diff) >= thr ? 'flag' : ''),
    tile('Largest rise', sm.maxUp ? `${sgn(sm.maxUp.diff)} m` : '–', sm.maxUp ? esc(sm.maxUp.loc) : 'no point higher', sm.maxUp && sm.maxUp.diff >= thr ? 'flag' : '')
  ].join('');
  const checks = st.checks.map(k => `<div class="check ${k.level}"><b>${k.level === 'ok' ? 'No large differences' : k.level === 'high' ? 'Check before issuing' : 'Worth a second look'}</b><p>${esc(k.text)}</p></div>`).join('');
  const flagRows = sm.flags.map(f => `<tr><td>${loc(f)}</td><td class="n">${fv(f.cur)}</td><td class="n">${fv(f.oth)}</td><td class="n d ${f.diff < 0 ? 'neg' : 'pos'}">${sgn(f.diff)}</td><td><span class="tag ${Math.abs(f.diff) >= thr * 2 ? 'high' : 'warn'}">${Math.abs(f.diff) >= thr * 2 ? 'Very large' : 'Large'}</span></td></tr>`).join('');
  const grpRows = sm.groups.map(g => `<tr><td>${esc(g.name)}</td><td class="n">${g.n}</td><td class="n">${sgn(g.avg)}</td><td class="n d ${g.max.diff < 0 ? 'neg' : 'pos'}">${sgn(g.max.diff)}</td><td>${loc(g.max)}</td></tr>`).join('');
  return `
  <section class="card" style="margin-bottom:18px">
    <div class="card-head"><h2>Current ${dC} vs ${c.name} ${dO}</h2><span class="muted">${sm.n} points compared · ${sm.nDown} lower · ${sm.nUp} higher</span></div>
    <p class="headline">${esc(st.headline)}</p>
    <div class="stats">${tiles}</div>
  </section>
  <div class="grid2">
    <section class="card"><h2>Sense check</h2>${checks}
      ${sm.flags.length ? `<div class="tbl-wrap" style="margin-top:14px"><table class="data list"><thead><tr><th>Reading</th><th class="n">Current</th><th class="n">${c.Name}</th><th class="n">Diff (m)</th><th></th></tr></thead><tbody>${flagRows}</tbody></table></div>` : ''}
    </section>
    <section class="card"><h2>Report wording</h2>
      <p class="muted" style="margin-bottom:10px;font-size:.92rem">For the "Changes in bed profile" box, with reference to the ${c.name} underwater report.</p>
      <textarea class="inp stmt" id="stmt" readonly rows="4">${esc(st.report)}</textarea>
      <div class="tbl-actions"><button class="btn sm" data-act="copy-stmt">Copy wording</button></div>
    </section>
    <section class="card span2"><h2>By section and element</h2>
      <div class="tbl-wrap"><table class="data list"><thead><tr><th>Section</th><th class="n">Points</th><th class="n">Average (m)</th><th class="n">Max (m)</th><th>Max at</th></tr></thead><tbody>${grpRows}</tbody></table></div>
      <p class="muted" style="font-size:.85rem;margin-top:10px">Difference = current bed level − ${c.name} bed level. Negative means the bed is lower now (possible scour); positive means it is higher (deposition).</p>
    </section>
  </div>`;
}
function pageChanges() {

function noWaterNote() {
  return `<div class="card note-warn" data-nowater ${waterOf(state) == null ? '' : 'hidden'}><b>Readings can't be converted yet.</b> Add the datum level and the current datum to water distance on <button class="linkbtn" data-act="page" data-v="site">Site details</button>.</div>`;
}
/* live refresh of calculated cells + charts without re-rendering inputs */
function refresh() {
  $$('[data-calc]').forEach(c => {
    const [k, path] = c.dataset.calc.split(':');
    if (k === 'water') { c.textContent = fv(waterOf(state, path)) || (c.tagName === 'B' ? '–' : ''); return; }
    const row = getPath(path);
    if (!row) return;
    if (k === 'lvl') c.textContent = fv(levelOf(state, row.reading));
    if (k === 'read') c.textContent = fv(row.reading);
  });
  $$('[data-nowater]').forEach(n => { n.hidden = waterOf(state) != null; });
  $$('[data-chart]').forEach(c => {
    const p = c.dataset.chart.split(':');
    if (p[0] === 'xs') c.innerHTML = xsChartFor(state, p[1], { fs: 13 });
    else { const el = state.elements[+p[1]], rad = el && el.radials[+p[2]]; if (rad) c.innerHTML = radialChartFor(state, rad, { w: 520, h: 330, title: '' }); }
  });
}

function getPath(path) { return path.split('.').reduce((o, k) => o == null ? o : o[/^\d+$/.test(k) ? +k : k], state); }
function setPath(path, val) {
  const ks = path.split('.'); const last = ks.pop();
  const o = ks.reduce((o, k) => o[/^\d+$/.test(k) ? +k : k], state);
  o[/^\d+$/.test(last) ? +last : last] = val;
}

/* ---------------- events ---------------- */
document.addEventListener('input', e => {
  const t = e.target; if (!t.dataset || !t.dataset.bind) return;
  const kind = t.dataset.kind;
  if (kind === 'num') setPath(t.dataset.bind, num(t.value));
  else setPath(t.dataset.bind, t.value);
  if (t.dataset.rerenderNum && num(t.value) > 0) { const cb = $('#chgBody'); if (cb) cb.innerHTML = changesBody(); }
  if (t.dataset.live === 'hdr') $('#hdrStruct').textContent = state.structure || 'New exam';
  if (t.dataset.live === 'chips') { const chip = $(`.chip[data-v="${ui.el}"]`); if (chip) chip.firstChild.textContent = t.value; }
  persist(); refresh();
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.act === 'add-el') { addElement(t.value); return; }
  if (t.dataset && t.dataset.bind) {
    if (t.dataset.kind === 'num' && t.value !== '') t.value = fv(num(t.value));
    if (t.dataset.rerender) { setPath(t.dataset.bind, t.value); persist(); render(); }
    if (t.dataset.bind.startsWith('dates.')) { persist(); }
  }
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if (e.key === 'Enter' && t.tagName === 'INPUT' && t.dataset.col != null) {
    e.preventDefault();
    const tr = t.closest('tr'); const next = tr && tr.nextElementSibling;
    const n = next && next.querySelector(`input[data-col="${t.dataset.col}"]`);
    if (n) { n.focus(); n.select(); } else t.blur();
  }
  if ((e.key === 'Enter' || e.key === ' ') && t.dataset && t.dataset.drop) { e.preventDefault(); $('#filePrev').click(); }
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.tagName === 'SELECT') return;
  const a = b.dataset.act, v = b.dataset.v;
  const close = () => { $('#msheet').classList.remove('on'); $('#scrim').classList.remove('on'); };
  switch (a) {
    case 'page': ui.page = v; persist(); render(); scrollTo({ top: 0 }); break;
    case 'sec': ui.sec = v; persist(); render(); break;
    case 'cmp': ui.cmp = v; persist(); render(); break;
    case 'goto': ui.page = b.dataset.page; if (b.dataset.sec) ui.sec = b.dataset.sec; if (b.dataset.el !== '') ui.el = +b.dataset.el; persist(); render(); scrollTo({ top: 0 }); break;
    case 'copy-stmt': { const t = $('#stmt'); const txt = t.value; const fallback = () => { t.focus(); t.select(); try { document.execCommand('copy'); toast('Wording copied.'); } catch (e) { toast('Select the text and copy it.'); } }; if (navigator.clipboard) navigator.clipboard.writeText(txt).then(() => toast('Wording copied.'), fallback); else fallback(); break; }
    case 'el': ui.el = +v; persist(); render(); break;
    case 'orient': state.sketchOrient = v; persist(); render(); break;
    case 'menu': $('#msheet').classList.add('on'); $('#scrim').classList.add('on'); break;
    case 'close-menu': close(); break;
    case 'add-row': { const rows = state.xs[ui.sec]; const last = rows[rows.length - 1]; const n = rows.filter(r => /^\d+$/.test(r.label)).length + 1; const idx = last && /BANK|ABT/i.test(last.label) ? rows.length - 1 : rows.length; rows.splice(idx, 0, { label: String(n), reading: null, prev: null, pen: null }); persist(); render(); break; }
    case 'del-row': state.xs[ui.sec].splice(+b.dataset.i, 1); persist(); render(); break;

/* Move last exam into Previous / Penultimate.
   Its current readings are converted with ITS OWN datum-to-water, then shifted onto this exam's datum

function importPrevious(old) {
  const s = state;
  if (!s.structure) s.structure = old.structure;
  if (!s.datumLocation) s.datumLocation = old.datumLocation;
  if (s.datumLevel == null) s.datumLevel = old.datumLevel;
  const shift = (s.datumLevel != null && old.datumLevel != null) ? r2(s.datumLevel - old.datumLevel) : 0;
  const sh = v => v == null ? null : r2(v + shift);
  const oldLevel = row => sh(row._level != null ? row._level : levelOf(old, row.reading));
  let missingD2W = false;
  s.dates.previous = old.dates.current || ''; s.dates.penultimate = old.dates.previous || '';
  s.d2w.previous = old.d2w.current; s.d2w.penultimate = old.d2w.previous;
  let nRows = 0, nPts = 0;
  SECTIONS.forEach(sec => {
    const oldRows = old.xs[sec.key] || [];
    if (!oldRows.length) return;
    let cur = s.xs[sec.key];
    cur.forEach(r => { r.prev = null; r.pen = null; });
    if (cur.every(r => r.reading == null)) { cur = s.xs[sec.key] = []; }
    let at = 0;
    oldRows.forEach(or => {
      const key = or.label.trim().toUpperCase();
      let idx = cur.findIndex(r => r.label.trim().toUpperCase() === key);
      if (idx < 0) { cur.splice(at, 0, { label: or.label, reading: null, prev: null, pen: null }); idx = at; }
      const t = cur[idx];
      if (or.reading != null && waterOf(old) == null) missingD2W = true;
      t.prev = oldLevel(or); t.pen = sh(or.prev);
      at = idx + 1; nRows++;

  s.elements.forEach(e => e.radials.forEach(r => r.points.forEach(p => { p.prev = null; p.pen = null; })));
  old.elements.forEach(oe => {
    let e = s.elements.find(x => x.name.trim().toUpperCase() === oe.name.trim().toUpperCase());
    if (!e) { e = clone(oe); e.id = newId(); e.radials.forEach(r => r.points.forEach(p => { p.reading = null; delete p._level; })); s.elements.push(e); }
    oe.radials.forEach(orad => {

}

function svgToPng(svg, w, h, scale) {

    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = Math.round(w * scale); c.height = Math.round(h * scale);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL('image/png'));

}

      cellSet(ws, r0, c0 + 1, sec.table, { head: true }); ws.mergeCells(r0, c0 + 1, r0, c0 + 3);
      cellSet(ws, r0, c0 + 4, 'Water Level (m)', { head: true }); ws.mergeCells(r0, c0 + 4, r0 + 1, c0 + 4);
      dates.forEach((d, i) => cellSet(ws, r0 + 1, c0 + 1 + i, d, { head: true }));
      ws.getRow(r0).height = 30;
      s.xs[sec.key].forEach((r, i) => {
        const rr = r0 + 2 + i;
        cellSet(ws, rr, c0, r.label, { bold: true });
        cellSet(ws, rr, c0 + 1, levelOf(s, r.reading) ?? '', { fill: soft });
        cellSet(ws, rr, c0 + 2, r.prev ?? (s.dates.previous ? '' : 'N/A'));
        cellSet(ws, rr, c0 + 3, r.pen ?? (s.dates.penultimate ? '' : 'N/A'));
        cellSet(ws, rr, c0 + 4, waterOf(s) ?? '');
      });
      return s.xs[sec.key].length + 2;
    };
    ws.getCell('A1').value = 'APPENDIX E – RIVERBED SOUNDINGS: TABULATED CROSS SECTION LEVELS'; ws.getCell('A1').font = { bold: true, size: 12, color: { argb: 'FF004578' } };
    const h1 = Math.max(block(3, 1, SECTIONS[0]), block(3, 15, SECTIONS[4]));
    const gd = [['General Data for structure', s.structure], ['Datum Level:', `${fv(s.datumLevel)} m`], ['Datum Position:', s.datumLocation], ['Datum to Water Level:', `${fv(s.d2w.current)} m  ${dates[0]}`], ['Previous Datum to Water Level:', `${s.d2w.previous == null ? 'N/A' : fv(s.d2w.previous) + ' m'}  ${dates[1]}`], ['Penultimate Datum to Water Level:', `${s.d2w.penultimate == null ? 'N/A' : fv(s.d2w.penultimate) + ' m'}  ${dates[2]}`], ['Notes', '1 U/S = Upstream; 2 D/S = Downstream; 3 All levels are relative to arbitrary datum above']];
    ws.getColumn(8).width = 30; ws.getColumn(9).width = 22; ws.getColumn(10).width = 22;
    gd.forEach((r, i) => { cellSet(ws, 3 + i, 8, r[0], { align: 'right', bold: true, ...(i === 0 ? { head: true } : {}) }); cellSet(ws, 3 + i, 9, r[1] ?? '', { align: 'left', bold: i === 0 }); ws.mergeCells(3 + i, 9, 3 + i, 12); });
    const r1 = 3 + Math.max(h1, gd.length) + 2;
    block(r1, 1, SECTIONS[1]); block(r1, 8, SECTIONS[2]); block(r1, 15, SECTIONS[3]);

    // XS plots
    const wsP = wb.addWorksheet('XS Plots');
    let row = 0;
    for (const sec of SECTIONS) {
      $('#busyMsg').textContent = `Drawing ${sec.name} plot…`;
      wsP.getCell(row + 1, 1).value = sec.plot; wsP.getCell(row + 1, 1).font = { bold: true, size: 12 };
      const im = await img(xsChartFor(s, sec.key, { w: 1000, h: 560, fs: 13 }));
      wsP.addImage(im.id, { tl: { col: 0, row: row + 1.3 }, ext: { width: 900, height: 504 } });
      row += 29;
    }

    // Radial sketch
    const wsS = wb.addWorksheet('Radial Sketch');
    wsS.getCell('A1').value = 'RADIALS SKETCH  ' + (s.structure || ''); wsS.getCell('A1').font = { bold: true, size: 12 };
    if (s.elements.length) {
      const sk = sketchSVG(sketchGeometry(s.elements, s.sketchOrient));
      const vb = sk.match(/viewBox="([^"]+)"/)[1].split(' ').map(Number);
      const sc = Math.min(700 / vb[2], 760 / vb[3]);
      const sized = sk.replace('<svg ', `<svg width="${vb[2] * sc}" height="${vb[3] * sc}" `);
      const im = await img(sized, 2);
      wsS.addImage(im.id, { tl: { col: 0.2, row: 2 }, ext: { width: im.w, height: im.h } });
      wsS.getCell(Math.ceil(im.h / 20) + 5, 1).value = 'Datum: ' + (s.datumLocation || '');
    }

    // Radials per element
    const used = new Set();
    for (const el of s.elements) {
      let nm = ('Radials ' + el.name).replace(/[\[\]:*?\/\\]/g, ' ').slice(0, 31).trim(), k = 2;
      while (used.has(nm.toUpperCase())) nm = nm.slice(0, 28) + ' ' + k++;
      used.add(nm.toUpperCase());
      const wr = wb.addWorksheet(nm);
      wr.columns = [{ width: 16 }, { width: 11 }, { width: 11 }, { width: 11 }, { width: 4 }];
      let r0 = 1;
      for (const rad of el.radials) {
        $('#busyMsg').textContent = `Drawing ${el.name} radial ${rad.n}…`;
        cellSet(wr, r0, 1, el.name, { head: true }); cellSet(wr, r0, 2, 'Radial ' + rad.n, { head: true }); wr.mergeCells(r0, 2, r0, 4);
        cellSet(wr, r0 + 1, 1, 'Distance from Structure (m)', { bold: true }); dates.forEach((d, i) => cellSet(wr, r0 + 1, 2 + i, d, { bold: true }));
        wr.getRow(r0 + 1).height = 30;
        rad.points.forEach((p, i) => {
          cellSet(wr, r0 + 2 + i, 1, p.d); cellSet(wr, r0 + 2 + i, 2, levelOf(s, p.reading) ?? '', { fill: soft });
          cellSet(wr, r0 + 2 + i, 3, p.prev ?? (s.dates.previous ? '' : 'N/A')); cellSet(wr, r0 + 2 + i, 4, p.pen ?? (s.dates.penultimate ? '' : 'N/A'));
        });
        const im = await img(radialChartFor(s, rad, { w: 520, h: 330 }));
        wr.addImage(im.id, { tl: { col: 5, row: r0 - 1 }, ext: { width: 468, height: 297 } });
        r0 += Math.max(17, rad.points.length + 4);
      }
      const kr = r0 + 1;
      [['KEY:', ''], ['Current water level', 'blue'], ['Bed level ' + dates[0], 'black'], ['Previous bed level ' + dates[1], 'red'], ['Penultimate bed level ' + dates[2], 'green']]
        .forEach((k2, i) => { wr.getCell(kr + i, 1).value = k2[0]; wr.getCell(kr + i, 2).value = k2[1]; if (!i) wr.getCell(kr, 1).font = { bold: true }; });
    }

    // Bed level changes
    const wc = wb.addWorksheet('Bed Level Changes');
    wc.columns = [{ width: 46 }, { width: 13 }, { width: 13 }, { width: 13 }, { width: 13 }];
    let cr = 1;
    const thrX = s.checkThreshold > 0 ? s.checkThreshold : 0.75;
    for (const which of ['prev', 'pen']) {
      const c = CMP[which], sm = summarize(comparePoints(s, which), thrX), st = changeStatements(s, which, sm, thrX);
      const t = wc.getCell(cr, 1); t.value = `Current ${dates[0]} vs ${c.name} ${dates[which === 'prev' ? 1 : 2]}`; t.font = { bold: true, size: 13, color: { argb: 'FF004578' } }; cr += 1;
      wc.getCell(cr, 1).value = st.headline; wc.mergeCells(cr, 1, cr, 5); wc.getCell(cr, 1).alignment = { wrapText: true }; wc.getRow(cr).height = 32; cr++;
      st.checks.forEach(k => { const cc = wc.getCell(cr, 1); cc.value = k.text; cc.font = { color: { argb: k.level === 'ok' ? 'FF0B6B33' : k.level === 'high' ? 'FFA1261A' : 'FF8A5300' } }; wc.mergeCells(cr, 1, cr, 5); cc.alignment = { wrapText: true }; wc.getRow(cr).height = 45; cr++; });
      if (sm.n) {
        [['Points compared', sm.n], ['Average change (m)', sm.avg], ['Average size of change (m)', sm.avgAbs], ['Maximum difference (m)', sm.max.diff], ['Maximum at', sm.max.loc], ['Largest drop (m)', sm.maxDown ? sm.maxDown.diff : ''], ['Largest drop at', sm.maxDown ? sm.maxDown.loc : ''], ['Largest rise (m)', sm.maxUp ? sm.maxUp.diff : ''], ['Largest rise at', sm.maxUp ? sm.maxUp.loc : ''], ['Report wording', st.report]]
          .forEach(r => { cellSet(wc, cr, 1, r[0], { align: 'left', bold: true }); cellSet(wc, cr, 2, r[1], { align: 'left' }); wc.mergeCells(cr, 2, cr, 5); cr++; });
        cr++;
        ['Reading', 'Current (m)', c.Name + ' (m)', 'Difference (m)', 'Flag'].forEach((hd, i) => cellSet(wc, cr, i + 1, hd, { head: true })); cr++;
        [...sm.items].sort((a, b) => Math.abs(b.diff) - Math.abs(a.diff)).forEach(it => {
          const big = Math.abs(it.diff) >= thrX * 2, flag = Math.abs(it.diff) >= thrX;
          cellSet(wc, cr, 1, it.loc, { align: 'left' }); cellSet(wc, cr, 2, it.cur); cellSet(wc, cr, 3, it.oth);
          cellSet(wc, cr, 4, it.diff, flag ? { fill: { type: 'pattern', pattern: 'solid', fgColor: { argb: big ? 'FFFBD9D4' : 'FFFFF0CC' } } } : {});
          cellSet(wc, cr, 5, big ? 'Very large' : flag ? 'Large' : ''); cr++;
        });
      }
      cr += 2;
    }

    // Embedded data so this workbook can be reopened or imported as previous data
    const wd = wb.addWorksheet('APP_DATA'); wd.state = 'hidden';
    const json = JSON.stringify(state);
    for (let i = 0, r = 1; i < json.length; i += 30000, r++) wd.getCell(r, 1).value = json.slice(i, i + 30000);

    const buf = await wb.xlsx.writeBuffer();
    busy(false);
    await saveFile(baseName() + '.xlsx', new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
  } catch (e) { busy(false); toast(e.message || 'The Excel file could not be built.', true); }
}

render();

</script>
